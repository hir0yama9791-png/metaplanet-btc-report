name: Daily Metaplanet & BTC Report

on:
  schedule:
    - cron: '0 21 * * *'
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      report_type:
        description: 'レポート種別（手動実行時のみ指定可）'
        required: false
        default: 'morning'
        type: choice
        options:
          - morning
          - closing

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Determine report type
        id: report_type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ github.event.inputs.report_type }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 6 * * *" ]; then
            echo "type=closing" >> "$GITHUB_OUTPUT"
          else
            echo "type=morning" >> "$GITHUB_OUTPUT"
          fi

      - name: Run daily report script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python daily_report.py ${{ steps.report_type.outputs.type }}
